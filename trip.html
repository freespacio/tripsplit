<body>
<div class="shell">
<header><div class="brand"><div class="mark" aria-hidden="true">T</div><div>Trip<span>Split</span></div></div><a class="dashboard-link" href="index.html">← My Trips</a><div class="access" id="access-label">Private trip</div></header>
<div id="offline-banner" class="offline-banner" role="status" aria-live="polite" hidden>You’re offline. Connect to Wi-Fi or mobile data to load your trip.</div>
<main id="app"><div class="loading">Opening your trip…</div></main>
<footer>TripSplit · Shared trip expenses, made simple.</footer>
</div>
<script>
const API_URL = "https://bnkndczemfyejtjcwiaj.supabase.co/functions/v1/trip-api";
const API_KEY = "sb_publishable_jUydjsVbylX7cK5K2ppGuA_upHZCnPm";
const app = document.getElementById("app");
const offlineBanner = document.getElementById("offline-banner");
function updateOfflineStatus(){offlineBanner.hidden=navigator.onLine;}
window.addEventListener("online",updateOfflineStatus);
window.addEventListener("offline",updateOfflineStatus);
updateOfflineStatus();
const TRIPS_KEY="tripsplit_saved_trips_v1";
function rememberTrip(record){try{const stored=JSON.parse(localStorage.getItem(TRIPS_KEY)||"[]");const items=Array.isArray(stored)?stored:[];localStorage.setItem(TRIPS_KEY,JSON.stringify([{...record,saved_at:new Date().toISOString()},...items.filter(x=>x.trip_id!==record.trip_id)].slice(0,100)))}catch(error){console.warn("Unable to save trip on this device.")}}

function showError(message, networkFailure = false) {
  const offline = networkFailure || !navigator.onLine || /failed to fetch|networkerror|load failed/i.test(message||"");
  const panel = document.createElement("section");
  panel.className = "error";
  const title = document.createElement("strong");
  title.textContent = offline ? "You’re offline" : "We couldn’t open this trip";
  const detail = document.createElement("p");
  detail.textContent = offline ? "Connect to Wi-Fi or mobile data to load your trip. Your private trip data is not available offline." : message;
  detail.style.margin = "8px 0 0";
  panel.append(title, detail);
  if(offline){const retry=document.createElement("button");retry.type="button";retry.textContent="Try again";retry.style.marginTop="12px";retry.addEventListener("click",()=>location.reload());panel.append(retry);}
  app.replaceChildren(panel);
}
function csvCell(value) {
  const text = value == null ? "" : String(value);
  return '"' + text.replace(/"/g,'""') + '"';
}
function downloadCsv(filename, rows) {
  const content = "\uFEFF" + rows.map(row => row.map(csvCell).join(",")).join("\r\n");
  const blob = new Blob([content], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadJson(filename, value) {
  const content = JSON.stringify(value, null, 2);
  const blob = new Blob([content], {type:"application/json;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

      const response = await fetch(API_URL,{
        method:"POST",headers:{"Content-Type":"application/json","apikey":API_KEY},
        body:JSON.stringify({action:"addSettlement",trip_id:tripId,token,from_participant_id:fromSelect.value,to_participant_id:toSelect.value,amount_cents:amountCents,settlement_date:repaymentDate.value,notes:repaymentNotes.value.trim()})
      });
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error(result.error || "We couldn't record this repayment.");
      const refresh = await fetch(API_URL,{
        method:"POST",headers:{"Content-Type":"application/json","apikey":API_KEY},
        body:JSON.stringify({action:"getTrip",trip_id:tripId,token})
      });
      const refreshed = await refresh.json();
      if (!refresh.ok || !refreshed.success) throw new Error(refreshed.error || "Repayment saved, but the dashboard couldn't refresh.");
      renderTrip(refreshed,tripId,token);
    } catch(error) {
      repaymentFeedback.textContent = error.message || "Please try again.";
    } finally {
      saveRepayment.disabled = false; saveRepayment.textContent = "Record repayment";
    }
  });

  const note = document.createElement("p"); note.className = "balance-note";
  note.textContent = "Only repayments you confirm as already made are recorded. Recorded repayments adjust balances but never change the original expenses.";
  balanceCard.append(balanceTitle,balanceHint,balancePeople,settlementList,history,settlementForm,note);
  const backupButton = document.createElement("button");
  backupButton.type = "button";
  backupButton.className = "export-button";
  backupButton.textContent = "Download JSON backup";
  backupButton.addEventListener("click", () => {
    const backup = {
      format: "TripSplit backup",
      schema_version: 1,
      exported_at: new Date().toISOString(),
      trip: {
        name: trip.name || "",
        base_currency: trip.base_currency || "EUR",
        start_date: trip.start_date || null,
        end_date: trip.end_date || null,
        status: trip.status || "active"
      },
      participants: (data.participants || []).map(person => ({
        id: person.id,
        name: person.name || "",
        role: person.role || (person.is_organiser ? "organiser" : "participant"),
        status: person.is_active === false ? "removed" : (person.status || "active"),
        is_organiser: Boolean(person.is_organiser)
      })),
      expenses: (data.expenses || []).map(item => ({
        id: item.id,
        description: item.description || "",
        category: item.category || "Other",
        amount_cents: Number(item.amount_cents || 0),
        expense_date: item.expense_date || null,
        expense_time: item.expense_time || null,
        payer_id: item.payer_id,
        payer_name: item.payer_name || "",
        split_type: item.split_type || "equal",
        shares: (item.shares || []).map(share => ({
          participant_id: share.participant_id,
          participant_name: share.participant_name || "",
          share_cents: Number(share.share_cents || 0)
        })),
        notes: item.notes || ""
      })),
      settlements: (data.settlements || []).map(item => ({
        id: item.id,
        from_participant_id: item.from_participant_id,
        to_participant_id: item.to_participant_id,
        from_name: item.from_name || "",
        to_name: item.to_name || "",
        amount_cents: Number(item.amount_cents || 0),
        settlement_date: item.settlement_date || null,
        status: item.status || "paid",
        notes: item.notes || ""
      }))
    };
    downloadJson(safeFilename(trip.name) + "-backup.json", backup);
  });
  hero.append(backupButton);
  const printButton = document.createElement("button");
  printButton.type = "button";
  printButton.className = "export-button";
  printButton.textContent = "Download PDF report";
  printButton.addEventListener("click", () => window.print());
  hero.append(printButton);
  const participantsButton = document.createElement("button");
  participantsButton.type = "button";
  participantsButton.className = "participants-button";
  participantsButton.textContent = "Participants · " + activeParticipants.length;
  const participantsDialog = document.createElement("dialog");
  participantsDialog.className = "participants-dialog";
  participantsDialog.setAttribute("aria-label","Trip participants");
  const participantsDialogHeader = document.createElement("div");
  participantsDialogHeader.className = "participants-dialog-header";
  const participantsDialogTitle = document.createElement("h2");
  participantsDialogTitle.textContent = "Participants";
  const closeParticipants = document.createElement("button");
  closeParticipants.type = "button";
  closeParticipants.className = "dialog-close";
  closeParticipants.setAttribute("aria-label","Close participants");
  closeParticipants.textContent = "×";
  closeParticipants.addEventListener("click",() => participantsDialog.close());
  participantsDialogHeader.append(participantsDialogTitle,closeParticipants);
  peopleCard.insertBefore(participantsDialogHeader,peopleCard.firstChild);
  participantsDialog.append(peopleCard);
  participantsButton.addEventListener("click",() => participantsDialog.showModal());
  hero.append(participantsButton);

  const report = document.createElement("section");
  report.className = "print-report";
  const reportTitle = document.createElement("h1");
  reportTitle.textContent = trip.name;
  const reportMeta = document.createElement("p");
  reportMeta.className = "report-meta";
  reportMeta.textContent = [
    "TripSplit expense report",
    trip.base_currency || "EUR",
    [dateLabel(trip.start_date),dateLabel(trip.end_date)].filter(Boolean).join(" – "),
    "Status: " + (trip.status || "active"),
    "Generated: " + new Intl.DateTimeFormat(undefined,{dateStyle:"medium"}).format(new Date())
  ].filter(Boolean).join(" · ");
  report.append(reportTitle,reportMeta);
  const addReportTable = (heading,headers,rows) => {
    const sectionTitle=document.createElement("h2");sectionTitle.textContent=heading;report.append(sectionTitle);
    const table=document.createElement("table");if(heading==="Expenses")table.classList.add("expenses-table");const thead=document.createElement("thead"),headerRow=document.createElement("tr");
    headers.forEach(value=>{const cell=document.createElement("th");cell.textContent=value;headerRow.append(cell);});
    thead.append(headerRow);
    const tbody=document.createElement("tbody");
    if(!rows.length){const row=document.createElement("tr"),cell=document.createElement("td");cell.colSpan=headers.length;cell.textContent="No records";row.append(cell);tbody.append(row);}
    else rows.forEach(values=>{const row=document.createElement("tr");values.forEach(value=>{const cell=document.createElement("td");cell.textContent=value==null?"":String(value);row.append(cell);});tbody.append(row);});
    table.append(thead,tbody);report.append(table);
  };
  addReportTable("Participants",["Name","Role","Status"],(data.participants||[]).map(person=>[
    person.name||"",person.role||(person.is_organiser?"Organiser":"Participant"),person.is_active===false?"Removed":(person.status||"Active")
  ]));
  addReportTable("Expenses",["Date","Time","Description","Category","Paid by","Amount","Split"],(data.expenses||[]).map(item=>[
    item.expense_date||"",item.expense_time?String(item.expense_time).slice(0,5):"",item.description||"",item.category||"Other",item.payer_name||"",formatMoney(item.amount_cents),
    (item.shares||[]).map(share=>share.participant_name+": "+formatMoney(share.share_cents)).join("; ")
  ]));
  addReportTable("Balances",["Participant","Expenses paid","Share of expenses","Repayment adjustment","Net balance"],balances.map(item=>[
    item.person.name,formatMoney(item.paid),formatMoney(item.share),formatMoney(item.settlementAdjustment),
    item.net>0?"Gets back "+formatMoney(item.net):item.net<0?"Owes "+formatMoney(Math.abs(item.net)):"Settled"
  ]));
  addReportTable("Recorded repayments",["Date","Paid by","Received by","Amount","Notes"],(data.settlements||[]).filter(item=>item.status==="paid").map(item=>[
    item.settlement_date||"",item.from_name||"",item.to_name||"",formatMoney(item.amount_cents),item.notes||""
  ]));
  const reportFooter=document.createElement("p");reportFooter.className="report-footer";
  reportFooter.textContent="Generated by TripSplit. Amounts are shown in "+(trip.base_currency||"EUR")+". Recorded repayments adjust balances and are not included as expenses.";
  report.append(reportFooter);

  grid.append(expenseCard,balanceCard);
  app.replaceChildren(hero,grid,report,participantsDialog);
}
async function openTrip() {
  const params = new URLSearchParams(location.hash.slice(1));
  const tripId = params.get("trip");
  const token = params.get("token");
  if (!tripId || !token) { showError("This link is missing its private access details. Please use the complete link shared with you."); return; }
  try {
    const response = await fetch(API_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":API_KEY},
      body:JSON.stringify({action:"getTrip",trip_id:tripId,token})
    });
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.error || "This link may be invalid or revoked.");
    rememberTrip({trip_id:tripId,token,name:data.trip.name,currency:data.trip.base_currency,start_date:data.trip.start_date||null,end_date:data.trip.end_date||null,status:data.trip.status,role:data.access.role,participant_name:data.access.participant_name||"",participant_names:(data.participants||[]).map(person=>person.name).filter(Boolean)});
    renderTrip(data, tripId, token);
  } catch(error) {
    const networkFailure = error instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(error.message || "");
    showError(error.message || "Please check your connection and try again.", networkFailure);
  }
}
openTrip();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(error => {
      console.warn("TripSplit offline support could not be started.", error);
    });
  });
}
</script>
