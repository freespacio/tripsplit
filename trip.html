 .trip-header-details{display:flex;align-items:center;flex-wrap:wrap;gap:9px}.trip-duration-badge{display:inline-flex;align-items:center;padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--accent-dark);font-size:12px;font-weight:750}.financial-summary{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 8px 26px rgba(25,42,55,.035)}.financial-summary-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}.financial-summary-heading h2{font-size:17px;margin:0;letter-spacing:-.3px}.financial-summary-heading p{font-size:12px;color:var(--muted);margin:4px 0 0}.financial-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.financial-metric{min-width:0;border:1px solid #edf0f3;border-radius:12px;padding:13px;background:#fbfcfd}.financial-metric-label{font-size:11px;color:var(--muted);font-weight:650;line-height:1.4}.financial-metric-value{font-size:clamp(18px,3vw,25px);font-weight:800;letter-spacing:-.5px;line-height:1.25;margin-top:6px;overflow-wrap:anywhere}.financial-category-section{margin-top:20px}.financial-category-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.financial-category-heading h3{font-size:13px;margin:0}.financial-category-heading span{font-size:11px;color:var(--muted)}.financial-category-list{display:grid;gap:12px}.financial-category-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}.financial-category-name{font-size:12px;font-weight:650;display:flex;align-items:center;gap:7px;min-width:0}.financial-category-name .record-type-pill{font-size:10px}.financial-category-amount{font-size:12px;font-weight:750;white-space:nowrap}.financial-category-track{grid-column:1/-1;height:6px;background:#edf1f4;border-radius:99px;overflow:hidden}.financial-category-fill{height:100%;border-radius:99px;background:var(--accent)}.financial-summary-empty{font-size:12px;color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:10px}.financial-summary-toggle{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#f8fafb;color:var(--accent-dark);font:inherit;font-size:12px;font-weight:750;cursor:pointer}.financial-summary-toggle:hover{background:var(--soft)}.financial-summary-toggle svg{width:15px;height:15px;transition:transform .18s ease}.financial-summary-toggle[aria-expanded=true] svg{transform:rotate(180deg)}.financial-summary-details[hidden]{display:none}.financial-participant-list{display:grid;gap:9px}.financial-participant-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(72px,auto) minmax(82px,auto);align-items:center;gap:10px;padding:9px 0;border-top:1px solid #edf0f3}.financial-participant-row>.participant-pill{justify-self:start;width:max-content;max-width:100%;min-width:0}.financial-participant-row>.participant-pill>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.financial-participant-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(72px,auto) minmax(82px,auto);gap:10px;padding:0 0 6px;color:var(--muted);font-size:10px;font-weight:750;text-align:right}.financial-participant-columns span:first-child{text-align:left}.financial-participant-total{font-size:13px;font-weight:800;white-space:nowrap;text-align:right}.financial-participant-owed{font-size:12px;font-weight:700;white-space:nowrap;text-align:right;color:var(--danger)}.participant-pill{gap:5px}.participant-pill svg{width:12px;height:12px;flex:0 0 12px;display:block}.spending-chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;min-height:145px;padding:8px 0 0}.spending-chart-day{display:grid;grid-template-rows:20px 82px 17px 17px;gap:4px;justify-items:center;min-width:0}.spending-chart-value{font-size:9px;color:var(--muted);font-weight:65 .people{display:grid;gap:0;margin-top:16px}.person{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid #edf0f3;font-size:14px}.person-identity{display:inline-flex;align-items:center;gap:6px;min-width:0}.person-identity .person-name{min-width:0;overflow-wrap:anywhere}.avatar{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--accent-dark);display:grid;place-items:center;font-weight:750;font-size:12px}.person-name{font-weight:650}.participant-pill{display:inline-flex;align-items:center;max-width:100%;padding:3px 8px;border:1px solid;border-radius:999px;font-size:11px;font-weight:700;line-height:1.35;white-space:nowrap;vertical-align:middle}.record-type-pill{display:inline-flex;align-items:center;max-width:100%;padding:3px 9px;border:1px solid;border-radius:7px;font-size:10px;font-weight:750;letter-spacing:.15px;line-height:1.4;white-space:nowrap;vertical-align:middle;background:#eef1f3;color:#4d5963;border-color:#d7dde2;gap:5px}.role{margin-left:auto;color:var(--muted);font-size:11px;text-transform:capitalize}

.expense-form{display:grid;gap:12px;margin:0;padding:18px 20px 0;overflow:auto;min-height:0;flex:1 1 auto}

function csvCell(value) {

async function compressTripCover(file) {
  if (!file.type || !file.type.startsWith("image/")) throw new Error("Please choose an image file.");
  if (file.size > 15 * 1024 * 1024) throw new Error("Please choose an image smaller than 15 MB.");
  const objectUrl = URL.createObjectURL(file);
  try {
    const image = new Image();
    await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error("This image couldn't be opened."));image.src=objectUrl;});
    if (!image.naturalWidth || !image.naturalHeight) throw new Error("This image couldn't be opened.");
    const scale = Math.min(1,1200/image.naturalWidth,675/image.naturalHeight);
    let width = Math.max(1,Math.round(image.naturalWidth*scale));
    let height = Math.max(1,Math.round(image.naturalHeight*scale));
    for (let attempt=0; attempt<5; attempt++) {
      const canvas = document.createElement("canvas"); canvas.width=width; canvas.height=height;
      const context = canvas.getContext("2d");
      if (!context) throw new Error("Your browser couldn't prepare this image.");
      context.drawImage(image,0,0,width,height);
      const quality = attempt===0 ? 0.82 : attempt===1 ? 0.74 : 0.66;
      const blob = await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",quality));
      if (!blob) throw new Error("Your browser couldn't compress this image.");
      if (blob.size <= 680000) return blob;
      width=Math.max(1,Math.round(width*0.82)); height=Math.max(1,Math.round(height*0.82));
    }
    throw new Error("This image is still too large. Please choose a smaller photo.");
  } finally { URL.revokeObjectURL(objectUrl); }
}

      const refresh = await fetch(API_URL,{

  const note = document.createElement("p"); note.className = "balance-note";

  const backupButton = document.createElement("button");
  backupButton.type = "button";
  backupButton.className = "export-button";
  backupButton.textContent = "Download JSON backup";
  backupButton.addEventListener("click", () => {
    const backup = {

        base_currency: trip.base_currency || "EUR",

      },

        status: person.is_active === false ? "removed" : (person.status || "active"),
        is_organiser: Boolean(person.is_organiser)
      })),
      expenses: (data.expenses || []).map(item => ({
        id: item.id,
        description: item.description || "",
        category: item.category || "Other",
        amount_cents: Number(item.amount_cents || 0),
        expense_date: item.expense_date || null,
        expense_time: item.expense_time || null,
        payer_id: item.payer_id,
        payer_name: item.payer_name || "",
        split_type: item.split_type || "equal",
        shares: (item.shares || []).map(share => ({
          participant_id: share.participant_id,

          share_cents: Number(share.share_cents || 0),

        })),
        notes: item.notes || ""
      })),
      settlements: (data.settlements || []).map(item => ({

  const printButton = document.createElement("button");
  printButton.type = "button";
  printButton.className = "export-button";
  printButton.textContent = "Download PDF report";
  let pendingPdfBlob = null;
  const pdfReadyDialog = document.createElement("dialog");
  pdfReadyDialog.className = "participants-dialog";
  pdfReadyDialog.setAttribute("aria-label","PDF report ready");
  const pdfReadyPanel = document.createElement("section");
  pdfReadyPanel.className = "card";
  const pdfReadyHeader = document.createElement("div");
  pdfReadyHeader.className = "participants-dialog-header";
  const pdfReadyTitle = document.createElement("h2");
  pdfReadyTitle.textContent = "PDF report ready";
  const closePdfReady = document.createElement("button");
  closePdfReady.type = "button";
  closePdfReady.className = "dialog-close";
  closePdfReady.setAttribute("aria-label","Close PDF options");
  closePdfReady.textContent = "×";
  closePdfReady.addEventListener("click",() => pdfReadyDialog.close());
  pdfReadyHeader.append(pdfReadyTitle,closePdfReady);
  const pdfReadyHint = document.createElement("p");
  pdfReadyHint.className = "hint";
  pdfReadyHint.textContent = "Your report has been created. Choose Share or Save to Files to keep a copy.";
  const sharePdfButton = document.createElement("button");
  sharePdfButton.type = "button";
  sharePdfButton.className = "export-button";
  sharePdfButton.textContent = "Share or save PDF";
  sharePdfButton.style.width = "100%";
  sharePdfButton.style.marginTop = "16px";
  sharePdfButton.addEventListener("click",() => {
    if (!pendingPdfBlob) return;
    const filename = safeFilename(trip.name) + "-report.pdf";
    if (isInstalledApp() && !(navigator.share && navigator.canShare && typeof File !== "undefined" && navigator.canShare({files:[new File([pendingPdfBlob],filename,{type:"application/pdf"})]}))) {
      window.alert("This iPhone app couldn't open the share sheet. Please open this trip in Safari to save the PDF.");
      return;

    deliverExportFile(filename,pendingPdfBlob);

  pdfReadyPanel.append(pdfReadyHeader,pdfReadyHint,sharePdfButton);
  pdfReadyDialog.append(pdfReadyPanel);
  printButton.addEventListener("click", async () => {
    if (typeof html2pdf !== "function") {

      const filename = safeFilename(trip.name) + "-report.pdf";

        image:{type:"jpeg",quality:0.98},
        html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",windowWidth:900},
        jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
        pagebreak:{mode:["css","legacy"]}
      }).from(report).outputPdf("blob");
      exportDialog.close();
      if (!pdfReadyDialog.isConnected) app.append(pdfReadyDialog);
      pdfReadyDialog.showModal();
    } catch(error) {
      console.error("TripSplit PDF export failed.",error);
      window.alert("TripSplit couldn't create the PDF report. Please try again or open this trip in Safari.");
    } finally {

      printButton.disabled = false;
      printButton.textContent = originalLabel;

  const exportButton = document.createElement("button");
  exportButton.type = "button";
  exportButton.className = "export-button";
  exportButton.textContent = "Export";
  const exportDialog = document.createElement("dialog");
  exportDialog.className = "participants-dialog export-dialog";
  exportDialog.setAttribute("aria-label","Export trip data");
  const exportPanel = document.createElement("section");
  exportPanel.className = "card";
  const exportHeader = document.createElement("div");
  exportHeader.className = "participants-dialog-header";
  const exportTitle = document.createElement("h2");
  exportTitle.textContent = "Export trip data";
  const closeExport = document.createElement("button");
  closeExport.type = "button";
  closeExport.className = "dialog-close";
  closeExport.setAttribute("aria-label","Close export options");
  closeExport.textContent = "×";
  closeExport.addEventListener("click",() => exportDialog.close());
  exportHeader.append(exportTitle,closeExport);
  const exportHint = document.createElement("p");
  exportHint.className = "hint";
  exportHint.textContent = "Choose the format you want to download.";
  const exportOptions = document.createElement("div");
  exportOptions.className = "export-options";
  exportExpenses.textContent = "Expenses CSV";
  backupButton.textContent = "JSON backup";
  printButton.textContent = "PDF report";
  [printButton,exportExpenses,exportSettlements,backupButton].forEach(button => {
    button.classList.add("export-choice");
    exportOptions.append(button);
  });
  exportPanel.append(exportHeader,exportHint,exportOptions);
  exportDialog.append(exportPanel);
  exportButton.addEventListener("click",() => exportDialog.showModal());
  const participantsButton = document.createElement("button");
  participantsButton.type = "button";
  participantsButton.className = "participants-button";

  participantsDialog.className = "participants-dialog";
  participantsDialog.setAttribute("aria-label","Trip participants");
  const participantsDialogHeader = document.createElement("div");
  participantsDialogHeader.className = "participants-dialog-header";
  const participantsDialogTitle = document.createElement("h2");
  participantsDialogTitle.textContent = "Participants";
  const closeParticipants = document.createElement("button");
  closeParticipants.type = "button";
  closeParticipants.className = "dialog-close";

  heroActionBar.append(exportButton,participantsButton);

  const report = document.createElement("section");

    "TripSplit expense report",
    trip.base_currency || "EUR",
    [dateLabel(trip.start_date),dateLabel(trip.end_date)].filter(Boolean).join(" – "),

  ].filter(Boolean).join(" · ");

    const sectionTitle=document.createElement("h2");sectionTitle.textContent=heading;report.append(sectionTitle);
    const table=document.createElement("table");if(heading==="Expenses")table.classList.add("expenses-table");const thead=document.createElement("thead"),headerRow=document.createElement("tr");
    headers.forEach(value=>{const cell=document.createElement("th");cell.textContent=value;headerRow.append(cell);});
    thead.append(headerRow);
    const tbody=document.createElement("tbody");
    if(!rows.length){const row=document.createElement("tr"),cell=document.createElement("td");cell.colSpan=headers.length;cell.textContent="No records";row.append(cell);tbody.append(row);}
    else rows.forEach(values=>{const row=document.createElement("tr");values.forEach(value=>{const cell=document.createElement("td");if(value instanceof Node)cell.append(value);else if(Array.isArray(value))cell.append(...value);else cell.textContent=value==null?"":String(value);row.append(cell);});tbody.append(row);});
    table.append(thead,tbody);report.append(table);
  };
  addReportTable("Participants",["Name","Role","Status"],(data.participants||[]).slice().sort(sortByParticipantName).map(person=>[
    participantPill(person.name,person.id),person.role||(person.is_organiser?"Organiser":"Participant"),person.is_active===false?"Removed":(person.status||"Active")
  ]));

  ]));

    item.net>0?"Gets back "+formatMoney(item.net):item.net<0?"Owes "+formatMoney(Math.abs(item.net)):"Settled"
  ]));
  addReportTable("Recorded repayments",["Date","Paid by","Received by","Amount","Notes"],(data.settlements||[]).filter(item=>item.status==="paid").map(item=>[
    item.settlement_date||"",participantPill(item.from_name,item.from_participant_id),participantPill(item.to_name,item.to_participant_id),formatMoney(item.amount_cents),item.notes||""
  ]));

  report.append(reportFooter);

}
async function openTrip() {
  const params = new URLSearchParams(location.hash.slice(1));
  const tripId = params.get("trip");
  const token = params.get("token");
  if (!tripId || !token) { showError("This link is missing its private access details. Please use the complete link shared with you."); return; }
  try {
    const response = await fetch(API_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":API_KEY},
      body:JSON.stringify({action:"getTrip",trip_id:tripId,token})
    });
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.error || "This link may be invalid or revoked.");
    rememberTrip({trip_id:tripId,token,name:data.trip.name,currency:data.trip.base_currency,start_date:data.trip.start_date||null,end_date:data.trip.end_date||null,status:data.trip.status,role:data.access.role,participant_name:data.access.participant_name||"",participant_names:(data.participants||[]).map(person=>person.name).filter(Boolean)});
    renderTrip(data, tripId, token);
  } catch(error) {
    const networkFailure = error instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(error.message || "");
    showError(error.message || "Please check your connection and try again.", networkFailure);
  }
}
openTrip();
