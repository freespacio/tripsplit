<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#235c50">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="description" content="Your private TripSplit shared expense dashboard.">
<title>Trip dashboard — TripSplit</title>
<style>
:root{color-scheme:light;--ink:#17202b;--muted:#687483;--line:#e3e8ee;--paper:#fff;--canvas:#f5f7f9;--accent:#235c50;--accent-dark:#19483f;--soft:#eaf2ef;--danger:#9b3434}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.shell{max-width:1040px;margin:0 auto;padding:22px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:34px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:750;letter-spacing:-.5px}.mark{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:white;font-size:20px;font-weight:800}.brand span{color:var(--accent)}
 .dashboard-link{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:8px 12px;color:var(--accent-dark);background:#fff;text-decoration:none;font-size:12px;font-weight:700;margin-right:auto}
.access{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 12px;white-space:nowrap}.access svg{width:15px;height:15px;flex:0 0 auto;color:var(--accent-dark)}
main{display:grid;gap:18px}.hero{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 12px 35px rgba(25,42,55,.04)}
.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:750;margin:0 0 12px}
h1{font-size:clamp(30px,5vw,42px);line-height:1.1;letter-spacing:-1.5px;margin:0 0 10px}.meta{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:23px}.card h2{font-size:17px;margin:0 0 5px;letter-spacing:-.3px}.hint{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
.people{display:grid;gap:0;margin-top:16px}.person{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid #edf0f3;font-size:14px}.avatar{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--accent-dark);display:grid;place-items:center;font-weight:750;font-size:12px}.person-name{font-weight:650}.role{margin-left:auto;color:var(--muted);font-size:11px;text-transform:capitalize}
.participant-link-button{border:1px solid #d8dfe6;border-radius:8px;background:#fff;color:var(--accent-dark);font-size:11px;font-weight:700;padding:7px 9px;cursor:pointer}.participant-link-button:disabled{opacity:.6}.participant-link-result{display:grid;gap:9px;padding:12px;margin:0 0 8px 43px;background:var(--soft);border-radius:10px;font-size:12px;overflow-wrap:anywhere}.participant-link-result p{margin:0;line-height:1.5}.participant-link-result button{justify-self:start;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;padding:8px 11px}.participant-link-result a{color:var(--accent-dark);font-weight:650}
.add-form{display:grid;gap:9px;margin-top:18px;padding-top:16px;border-top:1px solid #edf0f3}.add-form label{font-size:12px;font-weight:700}.add-form input{width:100%;height:43px;border:1px solid #d8dfe6;border-radius:9px;padding:0 11px;font:inherit}.add-form button{border:0;border-radius:9px;background:var(--accent);color:white;font-weight:700;padding:11px 14px}.add-form button:disabled{opacity:.6}.invite-result{margin-top:12px;padding:12px;border:1px solid #d5e3dd;background:var(--soft);border-radius:10px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.invite-result a{color:var(--accent-dark);font-weight:650}.copy-invite{margin-top:9px;background:white!important;color:var(--accent-dark)!important;border:1px solid #c9d8d2!important}.form-error{color:var(--danger);font-size:12px}.placeholder{margin-top:16px;border:1px dashed #d8e0e5;background:#fafbfc;border-radius:12px;padding:18px;color:var(--muted);font-size:13px;line-height:1.6}
.expense-form{display:grid;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid #edf0f3}
.expense-form label,.field-label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.expense-form input,.expense-form select,.expense-form textarea{width:100%;min-height:43px;border:1px solid #d8dfe6;border-radius:9px;padding:9px 11px;font:inherit;background:#fff;color:var(--ink)}
.expense-form textarea{min-height:70px;resize:vertical}
.expense-row{display:grid;grid-template-columns:1fr auto;gap:5px 12px;padding:14px 0;border-top:1px solid #edf0f3}.expense-actions{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}.expense-actions button{border:1px solid #d8dfe6;border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:12px;font-weight:650;padding:7px 11px}.expense-actions button.delete-expense{color:var(--danger);border-color:#ead1d1}
.expense-name{font-size:14px;font-weight:700}
.expense-amount{font-size:15px;font-weight:750;color:var(--accent-dark);white-space:nowrap}
.expense-meta,.expense-split{font-size:12px;color:var(--muted);line-height:1.5}
.expense-split{grid-column:1/-1}
.split-options{display:grid;gap:8px;padding:10px;border:1px solid #e3e8ee;border-radius:10px}
.split-editor{display:grid;gap:8px}
.split-share-row{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(90px,120px) auto;align-items:center;gap:8px;font-size:13px!important;font-weight:500!important;margin:0!important}
.split-share-row input{min-height:38px!important;padding:7px 9px!important}
.split-share-suffix{font-size:11px;color:var(--muted)}
.split-preview{font-size:12px;line-height:1.5;padding:9px 10px;background:#f7f9fa;border-radius:8px;overflow-wrap:anywhere}
.split-option{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.split-option input{width:16px;height:16px;min-height:0;accent-color:var(--accent)}
.expense-form button{border:0;border-radius:9px;background:var(--accent);color:white;font-weight:700;padding:12px 14px}
.expense-form button:disabled{opacity:.6}
.expense-feedback{font-size:12px;line-height:1.5;color:var(--danger)}
.expense-empty{margin-top:16px;border:1px dashed #d8e0e5;background:#fafbfc;border-radius:12px;padding:18px;color:var(--muted);font-size:13px;line-height:1.6}
.balance-card{grid-column:1/-1}
.balance-person{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 0;border-top:1px solid #edf0f3}
.balance-name{font-size:14px;font-weight:700}
.balance-net{font-size:14px;font-weight:750;text-align:right}
.balance-detail{font-size:12px;color:var(--muted);line-height:1.5}
.balance-positive{color:var(--accent-dark)}
.balance-negative{color:var(--danger)}
.settlement-list{display:grid;gap:9px;margin-top:17px;padding-top:15px;border-top:1px solid #edf0f3}
.settlement-list h3{font-size:13px;margin:0 0 3px}
.settlement-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f7f9fa;border-radius:10px;padding:12px;font-size:13px}
.settlement-item strong{white-space:nowrap}
.balance-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}
.settlement-form{display:grid;gap:11px;margin-top:17px;padding-top:16px;border-top:1px solid #edf0f3}
.settlement-form label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.settlement-form input,.settlement-form select,.settlement-form textarea{width:100%;min-height:43px;border:1px solid #d8dfe6;border-radius:9px;padding:9px 11px;font:inherit;background:#fff;color:var(--ink)}
.settlement-form textarea{min-height:64px;resize:vertical}
.settlement-form button{border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;padding:12px}
.settlement-form button:disabled{opacity:.6}
.settlement-confirm{display:flex!important;align-items:flex-start;gap:9px;font-weight:500!important;line-height:1.45}
.settlement-confirm input{width:17px;min-height:17px;height:17px;margin:0;flex:0 0 auto}
.settlement-feedback{font-size:12px;line-height:1.5;color:var(--danger)}
.settlement-history{display:grid;gap:8px;margin-top:16px;padding-top:15px;border-top:1px solid #edf0f3}
.settlement-history h3{font-size:13px;margin:0 0 2px}
.settlement-record{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px;padding:10px;background:#f7f9fa;border-radius:9px}
.settlement-record strong{white-space:nowrap}



.error{background:#fff0f0;border:1px solid #f0d4d4;color:var(--danger);border-radius:15px;padding:20px;line-height:1.6}.loading{color:var(--muted);padding:55px 15px;text-align:center}
footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:#87919b}
@media(max-width:680px){.shell{padding:16px 14px 40px}header{margin-bottom:22px}.hero{padding:24px}.grid{grid-template-columns:1fr;gap:13px}.card{padding:20px}.access{font-size:11px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><div class="mark" aria-hidden="true">T</div><div>Trip<span>Split</span></div></div><a class="dashboard-link" href="index.html">← My Trips</a><div class="access" id="access-label">Private trip</div></header>
<main id="app"><div class="loading">Opening your trip…</div></main>
<footer>TripSplit · Shared trip expenses, made simple.</footer>
</div>
<script>
const API_URL = "https://bnkndczemfyejtjcwiaj.supabase.co/functions/v1/trip-api";
const API_KEY = "sb_publishable_jUydjsVbylX7cK5K2ppGuA_upHZCnPm";
const app = document.getElementById("app");
const TRIPS_KEY="tripsplit_saved_trips_v1";
function rememberTrip(record){try{const stored=JSON.parse(localStorage.getItem(TRIPS_KEY)||"[]");const items=Array.isArray(stored)?stored:[];localStorage.setItem(TRIPS_KEY,JSON.stringify([{...record,saved_at:new Date().toISOString()},...items.filter(x=>x.trip_id!==record.trip_id)].slice(0,100)))}catch(error){console.warn("Unable to save trip on this device.")}}

function showError(message) {
  const panel = document.createElement("section");
  panel.className = "error";
  const title = document.createElement("strong");
  title.textContent = "We couldn't open this trip";
  const detail = document.createElement("p");
  detail.textContent = message;
  detail.style.margin = "8px 0 0";
  panel.append(title, detail);
  app.replaceChildren(panel);
}
function dateLabel(value) {
  if (!value) return "";
  const date = new Date(value + "T00:00:00");
  return new Intl.DateTimeFormat(undefined, {day:"numeric",month:"short",year:"numeric"}).format(date);
}
function initials(name) {
  return (name || "?").trim().split(/\s+/).slice(0,2).map(part=>part[0] || "").join("").toUpperCase();
}
function renderTrip(data, tripId, token) {
  const trip = data.trip;
  const access = data.access;
  document.title = trip.name + " — TripSplit";
  const accessLabel = document.getElementById("access-label");
  accessLabel.replaceChildren();
  const accessIcon = document.createElementNS("http://www.w3.org/2000/svg","svg");
  accessIcon.setAttribute("viewBox","0 0 24 24");
  accessIcon.setAttribute("fill","none");
  accessIcon.setAttribute("stroke","currentColor");
  accessIcon.setAttribute("stroke-width","1.8");
  accessIcon.setAttribute("stroke-linecap","round");
  accessIcon.setAttribute("stroke-linejoin","round");
  accessIcon.setAttribute("aria-hidden","true");
  const accessHead = document.createElementNS("http://www.w3.org/2000/svg","circle");
  accessHead.setAttribute("cx","12"); accessHead.setAttribute("cy","8"); accessHead.setAttribute("r","3.5");
  const accessBody = document.createElementNS("http://www.w3.org/2000/svg","path");
  accessBody.setAttribute("d","M5 20a7 7 0 0 1 14 0");
  accessIcon.append(accessHead,accessBody);
  const accessName = document.createElement("span");
  accessName.textContent = access.participant_name || (access.role === "organiser" ? "Organiser" : "Participant");
  accessLabel.setAttribute("aria-label","Viewing as " + accessName.textContent);
  accessLabel.append(accessIcon,accessName);
  const hero = document.createElement("section");
  hero.className = "hero";
  const eyebrow = document.createElement("p"); eyebrow.className = "eyebrow"; eyebrow.textContent = "Your shared trip";
  const title = document.createElement("h1"); title.textContent = trip.name;
  const meta = document.createElement("p"); meta.className = "meta";
  const dates = [dateLabel(trip.start_date), dateLabel(trip.end_date)].filter(Boolean);
  const details = [trip.base_currency, dates.length ? dates.join(" – ") : "", trip.status].filter(Boolean);
  meta.textContent = details.join(" · ");
  hero.append(eyebrow,title,meta);

  const grid = document.createElement("div"); grid.className = "grid";
  const peopleCard = document.createElement("section"); peopleCard.className = "card";
  const peopleTitle = document.createElement("h2"); peopleTitle.textContent = "Participants";
  const peopleHint = document.createElement("p"); peopleHint.className = "hint"; peopleHint.textContent = (data.participants || []).length + " people on this trip";
  const people = document.createElement("div"); people.className = "people";
  const makeParticipantRow = (person) => {
    const row = document.createElement("div"); row.className = "person";
    const avatar = document.createElement("div"); avatar.className = "avatar"; avatar.textContent = initials(person.name);
    const name = document.createElement("span"); name.className = "person-name"; name.textContent = person.name;
    const role = document.createElement("span"); role.className = "role"; role.textContent = person.role;
    row.append(avatar,name,role);
    if (data.access?.role === "organiser" && person.role === "organiser" && person.id === data.access.participant_id && trip.status === "active") {
      const ownLinkButton = document.createElement("button");
      ownLinkButton.type = "button";
      ownLinkButton.className = "participant-link-button";
      ownLinkButton.textContent = "Reissue my link";
      ownLinkButton.addEventListener("click", async () => {
        if (!confirm("Generate a new organiser link? Your current organiser link will stop working immediately.")) return;
        ownLinkButton.disabled = true;
        ownLinkButton.textContent = "Generating…";
        const previousPanel = row.nextElementSibling;
        if (previousPanel?.classList.contains("participant-link-result")) previousPanel.remove();
        try {
          const response = await fetch(API_URL, {
            method:"POST", headers:{"Content-Type":"application/json","apikey":API_KEY},
            body:JSON.stringify({action:"reissueOrganiserLink",trip_id:tripId,token,participant_id:person.id})
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || "We couldn't reissue your organiser link.");
          const panel = document.createElement("div");
          panel.className = "participant-link-result";
          const note = document.createElement("p");
          note.textContent = "Your new organiser link is ready. Your previous link has been revoked.";
          const copy = document.createElement("button");
          copy.type = "button";
          copy.textContent = "Copy link";
          copy.addEventListener("click", async () => {
            try { await navigator.clipboard.writeText(result.participant_link); copy.textContent = "Copied"; }
            catch { note.textContent = "Clipboard unavailable. Open the link below and copy it from the address bar."; }
          });
          const open = document.createElement("a");
          open.href = result.participant_link;
          open.textContent = "Open organiser link";
          open.target = "_blank";
          open.rel = "noopener";
          panel.append(note,copy,open);
          row.after(panel);
        } catch (error) {
          const panel = document.createElement("div");
          panel.className = "participant-link-result";
          panel.textContent = error.message || "Please try again.";
          row.after(panel);
        } finally {
          ownLinkButton.disabled = false;
          ownLinkButton.textContent = "Reissue my link";
        }
      });
      row.append(ownLinkButton);
    }
    if (data.access?.role === "organiser" && person.role === "participant" && trip.status === "active") {
      const showLinkPanel = (link, heading, revoked = false) => {
        const previousPanel = row.nextElementSibling;
        if (previousPanel?.classList.contains("participant-link-result")) previousPanel.remove();
        const panel = document.createElement("div");
        panel.className = "participant-link-result";
        const note = document.createElement("p");
        note.textContent = heading + (revoked ? " The previous link has been revoked." : " This is the existing link; it remains valid.");
        const copy = document.createElement("button");
        copy.type = "button";
        copy.textContent = "Copy link";
        copy.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(link); copy.textContent = "Copied"; }
          catch { note.textContent = "Clipboard unavailable. Open the link below and copy it from the address bar."; }
        });
        const open = document.createElement("a");
        open.href = link;
        open.textContent = "Open participant link";
        open.target = "_blank";
        open.rel = "noopener";
        panel.append(note,copy,open);
        row.after(panel);
      };
      const copyButton = document.createElement("button");
      copyButton.type = "button";
      copyButton.className = "participant-link-button";
      copyButton.textContent = "Copy link";
      copyButton.addEventListener("click", async () => {
        copyButton.disabled = true;
        copyButton.textContent = "Loading…";
        const previousPanel = row.nextElementSibling;
        if (previousPanel?.classList.contains("participant-link-result")) previousPanel.remove();
        try {
          const response = await fetch(API_URL, {
            method:"POST", headers:{"Content-Type":"application/json","apikey":API_KEY},
            body:JSON.stringify({action:"getParticipantLink",trip_id:tripId,token,participant_id:person.id})
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || "We couldn't retrieve this link.");
          showLinkPanel(result.participant_link, "Private link for " + person.name + ".");
        } catch (error) {
          const panel = document.createElement("div");
          panel.className = "participant-link-result";
          panel.textContent = error.message || "Please try again.";
          row.after(panel);
        } finally {
          copyButton.disabled = false;
          copyButton.textContent = "Copy link";
        }
      });
      const linkButton = document.createElement("button");
      linkButton.type = "button";
      linkButton.className = "participant-link-button";
      linkButton.textContent = "Reissue link";
      linkButton.addEventListener("click", async () => {
        if (!confirm("Generate a new private link for " + person.name + "? Their previous link will stop working immediately.")) return;
        linkButton.disabled = true;
        linkButton.textContent = "Generating…";
        const previousPanel = row.nextElementSibling;
        if (previousPanel?.classList.contains("participant-link-result")) previousPanel.remove();
        try {
          const response = await fetch(API_URL, {
            method:"POST", headers:{"Content-Type":"application/json","apikey":API_KEY},
            body:JSON.stringify({action:"reissueParticipantLink",trip_id:tripId,token,participant_id:person.id})
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || "We couldn't reissue this link.");
          showLinkPanel(result.participant_link, "New private link for " + person.name + ".", true);
        } catch (error) {
          const panel = document.createElement("div");
          panel.className = "participant-link-result";
          panel.textContent = error.message || "Please try again.";
          row.after(panel);
        } finally {
          linkButton.disabled = false;
          linkButton.textContent = "Reissue link";
        }
      });
      row.append(copyButton,linkButton);
    }
    return row;
  };
  (data.participants || []).forEach(person => people.append(makeParticipantRow(person)));
  peopleCard.append(peopleTitle,peopleHint,people);

  const addForm = document.createElement("form");
  addForm.className = "add-form";
  const addLabel = document.createElement("label");
  addLabel.textContent = "Add someone to this trip";
  addLabel.htmlFor = "participant-name";
  const addInput = document.createElement("input");
  addInput.id = "participant-name";
  addInput.name = "participant_name";
  addInput.type = "text";
  addInput.maxLength = 60;
  addInput.placeholder = "Participant's name";
  addInput.required = true;
  const addButton = document.createElement("button");
  addButton.type = "submit";
  addButton.textContent = "Add participant";
  const addFeedback = document.createElement("div");
  addFeedback.setAttribute("aria-live", "polite");
  addForm.append(addLabel,addInput,addButton,addFeedback);
  addForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const participantName = addInput.value.trim();
    if (!participantName) return;
    addButton.disabled = true;
    addButton.textContent = "Adding…";
    addFeedback.replaceChildren();
    try {
      const response = await fetch(API_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json","apikey":API_KEY},
        body:JSON.stringify({action:"addParticipant",trip_id:tripId,token,participant_name:participantName})
      });
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error(result.error || "We couldn't add this participant.");
      const message = document.createElement("div");
      message.className = "invite-result";
      const success = document.createElement("strong");
      success.textContent = participantName + " has been added.";
      const instruction = document.createElement("p");
      instruction.textContent = "Share this private invitation link with them. It gives access to this trip as a participant.";
      instruction.style.margin = "6px 0";
      const invite = document.createElement("a");
      invite.href = result.participant_link;
      invite.textContent = "Open invitation link";
      invite.target = "_blank";
      invite.rel = "noopener";
      const copyButton = document.createElement("button");
      copyButton.type = "button";
      copyButton.className = "copy-invite";
      copyButton.textContent = "Copy invitation link";
      copyButton.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(result.participant_link); copyButton.textContent = "Copied"; }
        catch { copyButton.textContent = "Copy unavailable — use the link above"; }
      });
      message.append(success,instruction,invite,document.createElement("br"),copyButton);
      addFeedback.append(message);
      addInput.value = "";
      people.append(makeParticipantRow({id:result.participant.id,name:result.participant.name,role:result.participant.role}));
      peopleHint.textContent = (people.children.length) + " people on this trip";
      rememberTrip({trip_id:tripId,token,name:trip.name,currency:trip.base_currency,start_date:trip.start_date||null,end_date:trip.end_date||null,status:trip.status,role:access.role,participant_name:access.participant_name||"",participant_names:[...(data.participants||[]).map(person=>person.name),result.participant.name].filter(Boolean)});
    } catch (error) {
      const errorText = document.createElement("div");
      errorText.className = "form-error";
      errorText.textContent = error.message || "Please try again.";
      addFeedback.append(errorText);
    } finally {
      addButton.disabled = false;
      addButton.textContent = "Add participant";
    }
  });
  peopleCard.append(addForm);

  const repaymentDateLabel = document.createElement("label"); repaymentDateLabel.textContent = "Date paid";
  const repaymentDate = document.createElement("input"); repaymentDate.type = "date"; const repaymentToday = new Date(); repaymentDate.value = repaymentToday.getFullYear() + "-" + String(repaymentToday.getMonth()+1).padStart(2,"0") + "-" + String(repaymentToday.getDate()).padStart(2,"0"); repaymentDate.required = true;
  const repaymentNotesLabel = document.createElement("label"); repaymentNotesLabel.textContent = "Notes (optional)";
  const repaymentNotes = document.createElement("textarea"); repaymentNotes.maxLength = 500; repaymentNotes.placeholder = "Optional details";
  const confirmLabel = document.createElement("label"); confirmLabel.className = "settlement-confirm";
  const confirmInput = document.createElement("input"); confirmInput.type = "checkbox"; confirmInput.required = true;
  const confirmText = document.createElement("span"); confirmText.textContent = "I confirm this repayment has already been made.";
  confirmLabel.append(confirmInput,confirmText);
  const saveRepayment = document.createElement("button"); saveRepayment.type = "submit"; saveRepayment.textContent = "Record repayment";
  const repaymentFeedback = document.createElement("div"); repaymentFeedback.className = "settlement-feedback"; repaymentFeedback.setAttribute("aria-live","polite");
  settlementForm.append(formTitle,fromLabel,fromSelect,toLabel,toSelect,repaymentAmountLabel,repaymentAmount,repaymentDateLabel,repaymentDate,repaymentNotesLabel,repaymentNotes,confirmLabel,saveRepayment,repaymentFeedback);
  settlementForm.addEventListener("submit", async event => {
    event.preventDefault();
    repaymentFeedback.textContent = "";
    const amountValue = Number(repaymentAmount.value);
    const amountCents = Math.round(amountValue * 100);
    if (!Number.isFinite(amountValue) || amountCents <= 0 || Math.abs(amountValue * 100 - amountCents) > 0.000001) {
      repaymentFeedback.textContent = "Enter a valid amount with no more than two decimal places."; return;
    }
    if (fromSelect.value === toSelect.value) { repaymentFeedback.textContent = "The payer and recipient must be different people."; return; }
    if (!confirmInput.checked) { repaymentFeedback.textContent = "Please confirm the repayment has already been made."; return; }
    saveRepayment.disabled = true; saveRepayment.textContent = "Saving…";
    try {
      const response = await fetch(API_URL,{
        method:"POST",headers:{"Content-Type":"application/json","apikey":API_KEY},
        body:JSON.stringify({action:"addSettlement",trip_id:tripId,token,from_participant_id:fromSelect.value,to_participant_id:toSelect.value,amount_cents:amountCents,settlement_date:repaymentDate.value,notes:repaymentNotes.value.trim()})
      });
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error(result.error || "We couldn't record this repayment.");
      const refresh = await fetch(API_URL,{
        method:"POST",headers:{"Content-Type":"application/json","apikey":API_KEY},
        body:JSON.stringify({action:"getTrip",trip_id:tripId,token})
      });
      const refreshed = await refresh.json();
      if (!refresh.ok || !refreshed.success) throw new Error(refreshed.error || "Repayment saved, but the dashboard couldn't refresh.");
      renderTrip(refreshed,tripId,token);
    } catch(error) {
      repaymentFeedback.textContent = error.message || "Please try again.";
    } finally {
      saveRepayment.disabled = false; saveRepayment.textContent = "Record repayment";
    }
  });

  const note = document.createElement("p"); note.className = "balance-note";
  note.textContent = "Only repayments you confirm as already made are recorded. Recorded repayments adjust balances but never change the original expenses.";
  balanceCard.append(balanceTitle,balanceHint,balancePeople,settlementList,history,settlementForm,note);
  grid.append(peopleCard,expenseCard,balanceCard);
  app.replaceChildren(hero,grid);
}
async function openTrip() {
  const params = new URLSearchParams(location.hash.slice(1));
  const tripId = params.get("trip");
  const token = params.get("token");
  if (!tripId || !token) { showError("This link is missing its private access details. Please use the complete link shared with you."); return; }
  try {
    const response = await fetch(API_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":API_KEY},
      body:JSON.stringify({action:"getTrip",trip_id:tripId,token})
    });
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.error || "This link may be invalid or revoked.");
    rememberTrip({trip_id:tripId,token,name:data.trip.name,currency:data.trip.base_currency,start_date:data.trip.start_date||null,end_date:data.trip.end_date||null,status:data.trip.status,role:data.access.role,participant_name:data.access.participant_name||"",participant_names:(data.participants||[]).map(person=>person.name).filter(Boolean)});
    renderTrip(data, tripId, token);
  } catch(error) {
    showError(error.message || "Please check your connection and try again.");
  }
}
openTrip();
</script>

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(error => {
      console.warn("TripSplit offline support could not be started.", error);
    });
  });
}
