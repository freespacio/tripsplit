<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripSplit API connection test</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f5f6f8;color:#20242b;padding:24px}
    main{max-width:560px;margin:48px auto;background:white;padding:28px;border-radius:16px}
    #status{padding:14px;border-radius:10px;background:#f0f1f3;overflow-wrap:anywhere}
  </style>
</head>
<body>
<main>
  <h1>TripSplit connection test</h1>
  <p>This page checks that the GitHub-hosted website can reach the TripSplit API.</p>
  <p id="status">Checking connection…</p>
</main>
<script>
const statusEl = document.getElementById("status");
fetch("https://bnkndczemfyejtjcwiaj.supabase.co/functions/v1/trip-api", {
  method: "GET",
  headers: {
    "apikey": "sb_publishable_jUydjsVbylX7cK5K2ppGuA_upHZCnPm"
  }
})
.then(async response => {
  const body = await response.json();
  if (!response.ok) throw new Error(body.message || body.error || ("HTTP " + response.status));
  if (body.success && body.app === "TripSplit") {
    statusEl.textContent = "Connected successfully — " + body.message;
    statusEl.style.background = "#e8f5e9";
  } else {
    throw new Error("The API responded, but the expected test response was not received.");
  }
})
.catch(error => {
  statusEl.textContent = "Connection test failed: " + error.message;
  statusEl.style.background = "#ffebee";
});
</script>
</body>
</html>
